name: HA command serialization

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  command-serialization:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - run: python -m pip install -e '.[dev,ha-tests]'
      - name: Require the actual Home Assistant runtime
        run: python -c 'import homeassistant.core'
      - run: python -m pytest tests/test_command_serialization.py -q
